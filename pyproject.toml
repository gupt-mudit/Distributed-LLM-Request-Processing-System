[tool.poetry]
name = "prompt-processing-system"
version = "0.1.0"
description = "Prompt processing pipeline with semantic caching, rate limiting, and durable execution."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
celery = "^5.4.0"
redis = "^5.0.0"
motor = "^3.3.0"
pymongo = "^4.6.0"
qdrant-client = "^1.7.0"
pydantic = "^2.7.0"
sentence-transformers = "^3.0.0"
structlog = "^24.1.0"
python-dotenv = "^1.0.1"
numpy = "^1.26.0"
prometheus-client = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
black = "^24.4.0"
isort = "^5.13.0"
mypy = "^1.10.0"
fakeredis = "^2.23.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


