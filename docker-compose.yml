version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - config/env.example
    volumes:
      - ./:/app
    depends_on:
      - mongodb
      - qdrant
      - redis
      - worker
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: >
      celery -A src.worker.app worker
      --loglevel=info
      --concurrency=4
      -Q prompt_high,prompt_normal,prompt_low
    env_file:
      - config/env.example
    volumes:
      - ./:/app
    depends_on:
      - mongodb
      - qdrant
      - redis

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A src.worker.app beat --loglevel=info
    env_file:
      - config/env.example
    volumes:
      - ./:/app
    depends_on:
      - redis

  mongodb:
    image: mongo:7
    command: mongod --noauth
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-prompt_db}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongodb-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  qdrant_data:


